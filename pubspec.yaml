name: delivery_photo_assist
description: 司机配送双照片拍摄辅助，提供取景、清晰度、相册与可替换的本地 PP-PicoDet 推理。
version: 0.1.1
publish_to: none
repository: https://github.com/zerowangyu/flutter-delivery-photo-assist
environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.8
  camera: ^0.12.0+1
  flutter_onnxruntime: 1.9.0
  permission_handler: ^12.0.3
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  image_picker: ^1.2.4
  dartcv4:
    path: packages/dartcv4
dev_dependencies:
  camera_platform_interface: ^2.15.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: dev.delivery.delivery_photo_assist
        pluginClass: DeliveryPhotoAssistPlugin
      ios:
        pluginClass: DeliveryPhotoAssistPlugin
  assets:
    - test/fixtures/synthetic.jpg
